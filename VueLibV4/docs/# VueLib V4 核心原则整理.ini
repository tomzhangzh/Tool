      }
    }
  ]
}
弹窗都使用layui的弹窗，我觉得这个比较好看。
并且所有的ConfigJson都需要可以在设计器中配置。所有可以将设计器做出一个弹窗，用传入configjson和defaultmodel既可以编辑，点击ok的时候，返回两个json就可以了

- 已包含：ElementPlus、Tailwind、LayUI、lodash、
需要一些新的组件，比如：DynSelect是dynelselect的扩展，可以传入sql语句，动态加载下拉列表。或者是ajax请求。（可能需要DynProject.id获取数据库连接）
你觉得常用的组件需要数据库的支持都需要添加到V4中。你是觉得改造dynelselect好或者是想添加新的组件都可以。
- 已包含：ElementPlus、Tailwind、LayUI、lodash、
5. **数据库：SqlSugar ORM，双库分离 Platform / Business**
支持无实体 Model 直接 CRUD，SqlSugar 自动读取表元信息（主键、字段类型），只需要表名即可分页、排序、增删改查。
6.根据这些规则，v4中补齐V1中缺少的功能，生成页面都是用data-dyn-init-createapp来初始化的。V1比如桌面，解决方案管理，工程管理的，模板管理
7. **模板：DynTemplate**
V1 中的[DynTemplate]也和我想做的不太一样，dynTemplate你可以理解成为一特殊的组件或者是一个mvc页面dyn-init,可以配置一下参数，供[DynWebPage]使用

比如 可以定义一个3page的template，包括filter，list，detail。他们之间的关系和动作已经在template中写好了目前可以是固定的view。然后在[PageSetting]中定义filter,list,detail的显示（这个是可以配置的比如filter是个下拉从数据库读取）

在DynWebPage中先设置这个模板，在选择filter，list，detail对应的pageSetting这样和对应的url这个页面就完成了

当然也可以直接使用url返回页面，目前先使用DynWebPage定义的，右侧的属性栏也可以使用dynamic组件来完成配置，其实就是更改[ConfigJson]
---
8.V1页面管理和我想的也不一样。特别是从数据库生成的页面。应该是选择数据库中的一个表和字段，然后根据字段生成对应的页面配置就是设计器中配置的动态组件。
Detail就是字段名称之类的，Filter就是查询条件。 {"ClassName": { "op": "like", "value": "一" }}filter中modelname其实就是ClassName.value,op不要显示在页面上
Summary就是列表，点击列表项可以跳转到详情页面。（datatable的这个组件还没有做好，如果你能弄好那就太好了！！！！）如果不行就生成MVCView就行

