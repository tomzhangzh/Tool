# VueLib V4 核心原则整理

> 
> 核心总纲：**程序员尽量少手写 JS 代码，优先使用 ActionHelper 配置驱动，减少硬编码**
ElementPlus、Tailwind、LayUI、lodash、默认在每个地方都可以使用。
dyn-render.js应该去除，和dynDynamicCom高度重合，使用dynDynamicCom即可。
1. **逻辑优先 ActionHelper**
页面交互、数据加载、提交、弹窗、跳转等动作，尽可能用 ActionHelper 声明式配置实现，而不是手写大量 JS；只在极度特殊场景才写自定义代码。
示例：`dyn-click="ActionHelper.Submit|ActionHelper.ReloadTarget"`，配置字符串驱动一连串动作。
尽可能所有的动作，都用 ActionHelper 配置驱动，而不是手写 JS 代码。
如果你认为需要添加ActionHelper请添加dyn-action.js中。（尽可能的添加：比如）
V1中的DynJavaScript需要在V4中实现，目的是可以通过MVC的view，或者json执行前端代码。这个需要ApiResult中添加一个属性dyn-actions，用于存储前端代码。
比如：保存完数据后，需要刷新列表。或者是closewindow，toast 保存成功，
2. **页面分块 + 局部刷新（核心）** MVC view 片段渲染优先
页面拆成多个独立区块，**不整页刷新**；通过 `updateEl` 指令，向后端 Controller 发起请求，后端返回 HTML 片段 / 组件片段，渲染替换页面上指定 DOM 元素。
示例：


<div dyn-click-updateEl="#resultPanel" data-url="/Home/QueryBlock">查询</div>
<div id="resultPanel"   data-dyn-init-createapp data-dyn-use-scope="designer"></div>
通过 `dyn-use-scope` 指令共享model，实现app之间的数据传递。请查考designer的left panel。Canvas,right panel。

前端只负责触发，后端 MVC 返回 View 片段，局部替换元素。

3. **后端采用 C# MVC**
后端主体用 `.NET MVC`，Controller 接收 dyn-xx 指令提交的数据，返回局部 View，配合前端 dyn 指令做局部渲染。

> 
> 不再单纯 AJAX 拿 JSON，而是 dyn 指令提交 → Controller → 返回 View 片段 → 前端替换指定 DOM。

4. **组件范围**

- ✅ 保留：项目内置数据库相关组件 ComponentMeta 中的PropertyConfigJson补充一下，生成sql更新到数据库中
- ❌ 暂时不用：NutUI 等第三方 UI 组件库
-PropertyConfigJson也是使用dyndynamicCom渲染组件自身的属性（比如：按钮的文本、表单的label等）例如：  {
  "component": "DynGridContainer",
  "options": {
    "comoptions": {
      "gridTemplateColumns": "1fr 1fr",
      "gap": "16px",
      "size": "large"
    },
    "labeloptions": {
      "show": false,
      "labelPosition": "left"
    },
    "itemoptions": {
      "class": "p-4"
    },
    "comInnerInfo": {
      "comPassThrough": "size,labeloptions",
      "size": "large"
    }
  },
  "childrenctrls": [
    {
      "component": "DynElInput",
      "options": {
        "comoptions": {
          "placeholder": "请输入",
          "clearable": true,
          "size": "large"
        },
        "labeloptions": {
