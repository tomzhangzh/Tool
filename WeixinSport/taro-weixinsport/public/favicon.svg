<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <!-- 文字渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:0.95" />
    </linearGradient>
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" fill="url(#bg)" rx="80" ry="80"/>
  
  <!-- 装饰圆（左上） -->
  <circle cx="80" cy="80" r="60" fill="#FFFFFF" opacity="0.08"/>
  <!-- 装饰圆（右下） -->
  <circle cx="430" cy="430" r="80" fill="#FFFFFF" opacity="0.06"/>
  <!-- 装饰小圆 -->
  <circle cx="400" cy="100" r="20" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="100" cy="420" r="30" fill="#FFFFFF" opacity="0.08"/>
  
  <!-- 主要文字：华曜大学城 -->
  <g transform="translate(256,230)" filter="url(#glow)">
    <!-- 文字阴影层 -->
    <text text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="92" font-weight="800" fill="#000033" opacity="0.2" y="2">华曜大学城</text>
    <!-- 主文字 -->
    <text text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="92" font-weight="800" fill="url(#textGrad)" y="0">华曜大学城</text>
  </g>
  
  <!-- 副标题 -->
  <g transform="translate(256,330)">
    <text text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" opacity="0.75">HUAYAO SPORT</text>
  </g>
  
  <!-- 分隔线 -->
  <g transform="translate(256,365)">
    <line x1="-60" y1="0" x2="-20" y2="0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" opacity="0.6"/>
    <line x1="20" y1="0" x2="60" y2="0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- 底部小字 -->
  <g transform="translate(256,400)">
    <text text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#FFFFFF" opacity="0.6">运动打卡 · 健康成长</text>
  </g>
  
  <!-- 四角装饰 -->
  <g opacity="0.4">
    <!-- 左上 -->
    <path d="M 40,80 L 40,40 L 80,40" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 右上 -->
    <path d="M 472,40 L 472,80 L 432,80" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 左下 -->
    <path d="M 40,432 L 40,472 L 80,472" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 右下 -->
    <path d="M 472,432 L 472,472 L 432,472" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
